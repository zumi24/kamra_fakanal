services:
  csaladi-recepttar:
    image: python:3.11-slim-bookworm
    container_name: csaladi-recepttar
    working_dir: /app
    volumes:
      - ./:/app
      - ./data:/app/data
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
      - HOST=0.0.0.0
    command: sh -c "pip install -r requirements.txt && python app.py"
    restart: unless-stopped
